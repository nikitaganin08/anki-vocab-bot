services:
  app:
    container_name: anki-app
    image: ${APP_IMAGE:-anki-vocab-bot:local}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    volumes:
      - ./backend/data:/app/backend/data
    networks:
      - default
      - edge

networks:
  edge:
    external: true
