name: Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -euo pipefail
            cd /opt/anki-vocab-bot
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            export APP_IMAGE="ghcr.io/${{ github.repository }}:latest"
            docker compose pull app
            docker compose up -d app
            docker compose exec -T app alembic upgrade head
            docker image prune -f

      - name: Upload nginx routes
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: deploy/nginx/anki.conf
          target: /opt/anki-vocab-bot/nginx
          strip_components: 2

      - name: Upload backup scripts
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: deploy/backup/backup.sh,deploy/backup/restore.sh
          target: /opt/anki-vocab-bot/backup
          strip_components: 2

      - name: Apply nginx routes
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -euo pipefail
            snippet=/opt/nginx/snippets/anki.conf
            nginx_exec="docker compose -f /opt/nginx/docker-compose.yml exec -T nginx"
            cp "$snippet" "$snippet.prev"
            cp /opt/anki-vocab-bot/nginx/anki.conf "$snippet"
            if $nginx_exec nginx -t; then
              $nginx_exec nginx -s reload
            else
              cp "$snippet.prev" "$snippet"
              echo "nginx -t failed; previous routes restored" >&2
              exit 1
            fi

      - name: Set Telegram webhook
        run: |
          set -euo pipefail
          response=$(curl -sS --fail "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/setWebhook" \
            -d "url=${{ secrets.TELEGRAM_WEBHOOK_URL }}" \
            -d "secret_token=${{ secrets.TELEGRAM_WEBHOOK_SECRET }}")
          echo "$response"
          echo "$response" | grep -q '"ok":true'

      - name: Set Telegram bot profile and commands
        # Telegram rate-limits profile edits; a failure here must not fail the deploy.
        continue-on-error: true
        run: |
          set -euo pipefail
          api="https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}"
          post() { curl -sS --fail "$api/$1" -H "Content-Type: application/json" -d "$2" | grep -q '"ok":true'; }
          post setMyName '{"name":"Wordloop"}'
          post setMyShortDescription '{"short_description":"English words in context: instant cards and FSRS review right in Telegram."}'
          post setMyDescription '{"description":"Send a word, phrasal verb or idiom, in English or Russian. Wordloop makes a card: translation, transcription and natural usages like \"give up smoking\". Then it reminds you to review when the word starts to fade.\n\n/review — review words\n/admin — dictionary, stats and settings\n/find — find a word by description"}'
          commands='{"commands":[{"command":"review","description":"Review words"},{"command":"admin","description":"Dictionary, stats and settings"},{"command":"find","description":"Find a word by description"}]}'
          # A stale private-chat scope would shadow the default list in private chats.
          post deleteMyCommands '{"scope":{"type":"all_private_chats"}}'
          post setMyCommands "$commands"

      - name: Verify Telegram webhook
        run: |
          set -euo pipefail
          info=$(curl -sS --fail "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/getWebhookInfo")
          echo "$info"
          echo "$info" | grep -q "\"url\":\"${{ secrets.TELEGRAM_WEBHOOK_URL }}\""
