name: Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload compose file
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: docker-compose.yml
          target: /opt/anki-vocab-bot

      - name: Upload nginx routes
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: deploy/nginx/anki.conf
          target: /opt/anki-vocab-bot/nginx
          strip_components: 2

      - name: Upload backup scripts
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: deploy/backup/backup.sh,deploy/backup/restore.sh
          target: /opt/anki-vocab-bot/backup
          strip_components: 2

      # GitHub Secrets are the only copy of the app's secrets: .env and the backup's S3 config
      # on the server are rewritten from them on every deploy, so a new server needs no
      # hand-made files.
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USER_ID: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
          TELEGRAM_WEBHOOK_URL: ${{ secrets.TELEGRAM_WEBHOOK_URL }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          TELEGRAM_WEBAPP_URL: ${{ secrets.TELEGRAM_WEBAPP_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YANDEX_TTS_API_KEY: ${{ secrets.YANDEX_TTS_API_KEY }}
          CLIP_TOKEN: ${{ secrets.CLIP_TOKEN }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: TELEGRAM_BOT_TOKEN,TELEGRAM_ALLOWED_USER_ID,TELEGRAM_WEBHOOK_URL,TELEGRAM_WEBHOOK_SECRET,TELEGRAM_WEBAPP_URL,OPENROUTER_API_KEY,YANDEX_TTS_API_KEY,CLIP_TOKEN,S3_ACCESS_KEY_ID,S3_SECRET_ACCESS_KEY,S3_BUCKET
          script: |
            set -euo pipefail
            cd /opt/anki-vocab-bot
            umask 077

            for k in TELEGRAM_BOT_TOKEN TELEGRAM_ALLOWED_USER_ID TELEGRAM_WEBHOOK_URL TELEGRAM_WEBHOOK_SECRET TELEGRAM_WEBAPP_URL OPENROUTER_API_KEY; do
              if [ -z "${!k:-}" ]; then echo "secret $k is empty" >&2; exit 1; fi
            done
            {
              echo "DATABASE_URL=sqlite:///backend/data/app.db"
              for k in TELEGRAM_BOT_TOKEN TELEGRAM_ALLOWED_USER_ID TELEGRAM_WEBHOOK_URL TELEGRAM_WEBHOOK_SECRET TELEGRAM_WEBAPP_URL OPENROUTER_API_KEY YANDEX_TTS_API_KEY CLIP_TOKEN; do
                if [ -n "${!k:-}" ]; then printf '%s=%s\n' "$k" "${!k}"; fi
              done
            } > .env.new
            mv .env.new .env

            if [ -n "${S3_BUCKET:-}" ]; then
              printf 'S3_ACCESS_KEY_ID=%s\nS3_SECRET_ACCESS_KEY=%s\nS3_BUCKET=%s\n' \
                "$S3_ACCESS_KEY_ID" "$S3_SECRET_ACCESS_KEY" "$S3_BUCKET" > "$HOME/.backup-s3.env"
            fi

            mkdir -p "$HOME/backups/wordloop"
            job='17 4 * * * /opt/anki-vocab-bot/backup/backup.sh >> $HOME/backups/wordloop/backup.log 2>&1'
            ( crontab -l 2>/dev/null | grep -vF /backup/backup.sh || true; echo "$job" ) | crontab -

            mkdir -p backend/data
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            export APP_IMAGE="ghcr.io/${{ github.repository }}:latest"
            docker compose pull app
            docker compose up -d app
            docker compose exec -T app alembic upgrade head
            docker image prune -f

      - name: Apply nginx routes
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -euo pipefail
            snippet=/opt/nginx/snippets/anki.conf
            nginx_exec="docker compose -f /opt/nginx/docker-compose.yml exec -T nginx"
            cp "$snippet" "$snippet.prev"
            cp /opt/anki-vocab-bot/nginx/anki.conf "$snippet"
            if $nginx_exec nginx -t; then
              $nginx_exec nginx -s reload
            else
              cp "$snippet.prev" "$snippet"
              echo "nginx -t failed; previous routes restored" >&2
              exit 1
            fi

      - name: Set Telegram webhook
        run: |
          set -euo pipefail
          response=$(curl -sS --fail "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/setWebhook" \
            -d "url=${{ secrets.TELEGRAM_WEBHOOK_URL }}" \
            -d "secret_token=${{ secrets.TELEGRAM_WEBHOOK_SECRET }}" \
            --data-urlencode 'allowed_updates=["message","callback_query"]')
          echo "$response"
          echo "$response" | grep -q '"ok":true'

      - name: Sync Telegram bot profile and commands
        # Telegram rate-limits profile edits; only differences are written, and a failure here
        # must not fail the deploy.
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python3 deploy/telegram/profile.py

      - name: Verify Telegram webhook
        run: |
          set -euo pipefail
          info=$(curl -sS --fail "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/getWebhookInfo")
          echo "$info"
          echo "$info" | grep -q "\"url\":\"${{ secrets.TELEGRAM_WEBHOOK_URL }}\""
          echo "$info" | grep -q 'callback_query'
