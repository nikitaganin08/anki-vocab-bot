# anki-vocab-bot routes under /anki/ on the shared edge nginx.
# Synced by .github/workflows/deploy.yml to /opt/nginx/snippets/anki.conf, which the
# edge server block includes; TLS, the domain and other sites live in /opt/nginx.

location = /anki/telegram/webapp {
    return 301 /anki/telegram/webapp/;
}

# Mini App static files and the Telegram webhook (checked by its secret token).
location ^~ /anki/telegram/ {
    rewrite ^/anki/(.*)$ /$1 break;
    proxy_pass http://anki-app:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Every /api route authenticates itself (Telegram Web App init data), except the
# health check, so new endpoints need no nginx change.
location ^~ /anki/api/ {
    rewrite ^/anki/(.*)$ /$1 break;
    proxy_pass http://anki-app:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
